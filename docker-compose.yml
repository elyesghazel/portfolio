services:
  main-site:
    build: .
    container_name: main-site
    restart: always
    networks:
      - traefik_proxy
    # Only the nginx config is mounted; the built site is baked into the image.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.main-site.rule=Host(`elyesghazel.ch`) || Host(`www.elyesghazel.ch`)"
      - "traefik.http.routers.main-site.entrypoints=https"
      - "traefik.http.routers.main-site.tls=true"
      - "traefik.http.routers.main-site.tls.certresolver=cloudflare"
      - "traefik.http.services.main-site.loadbalancer.server.port=80"

networks:
  traefik_proxy:
    external: true
