<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply a saved theme before first paint so there is no flash.
      // Without one, the OS preference decides (handled in CSS).
      (function () {
        var root = document.documentElement, t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t === "light" || t === "dark") root.dataset.theme = t;
        root.className += " js";
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />

    <title>Elyes Ghazel - Software Engineer</title>
    <meta
      name="description"
      content="Elyes Ghazel, software engineer in Zürich. Backends, web apps, custom hardware, and the servers underneath. Founder of SlidePlate."
    />
    <meta name="author" content="Elyes Ghazel" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://elyesghazel.ch/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elyesghazel.ch/" />
    <meta property="og:title" content="Elyes Ghazel - Software Engineer" />
    <meta
      property="og:description"
      content="Backends, web apps, custom hardware, and the servers underneath. Founder of SlidePlate."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Elyes Ghazel - Software Engineer" />
    <meta
      name="twitter:description"
      content="Backends, web apps, custom hardware, and the servers underneath. Founder of SlidePlate."
    />

    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
