services:
  main-site:
    image: nginx:alpine
    container_name: main-site
    restart: always
    networks:
      - traefik_proxy
    volumes:
      # Pfad zum eben gebauten dist-Ordner
      - ./elyesghazel-site/dist:/usr/share/nginx/html:ro
      # Die Nginx-Konfiguration für React Router (siehe unten)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.main-site.rule=Host(`elyesghazel.ch`) || Host(`www.elyesghazel.ch`)"
      - "traefik.http.routers.main-site.entrypoints=https"
      - "traefik.http.routers.main-site.tls=true"
      - "traefik.http.routers.main-site.tls.certresolver=cloudflare"
      - "traefik.http.services.main-site.loadbalancer.server.port=80"

networks:
  traefik_proxy:
    external: true
